version: 2

models:
  - name: stg_acs
    description: >
      Staged U.S. Census Bureau American Community Survey (ACS)
      2024 5-Year State Comparison Profile data.

      Grain: one row per state or territory per ACS estimate period.
      Business key: state_fips + estimate_period.

      The model renames Census variable codes to semantic business
      names and converts RAW VARCHAR values into analytical numeric
      data types.

    columns:
      - name: state_name
        description: State or territory name.
        tests:
          - not_null

      - name: state_fips
        description: >
          Two-digit U.S. Census state or territory FIPS code.
          Stored as VARCHAR to preserve leading zeros.
        tests:
          - not_null

      - name: estimate_period
        description: >
          ACS 5-Year estimate period represented by the record.
          The 2024 ACS 5-Year estimates cover 2020-2024.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - '2020-2024'

      - name: total_population
        description: Total population estimate.

      - name: median_household_income
        description: Median household income in dollars.

      - name: per_capita_income
        description: Per capita income in dollars.

      - name: pct_high_school_or_higher
        description: >
          Percentage of the population age 25 and over
          with a high school diploma or higher.

      - name: pct_bachelors_or_higher
        description: >
          Percentage of the population age 25 and over
          with a bachelor's degree or higher.

      - name: unemployment_rate
        description: Civilian labor force unemployment rate.

      - name: pct_families_below_poverty
        description: >
          Percentage of families whose income in the past 12 months
          was below the poverty level.

      - name: pct_people_below_poverty
        description: >
          Percentage of people whose income in the past 12 months
          was below the poverty level.