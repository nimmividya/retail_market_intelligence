version: 2

models:
  - name: mart_retail_state
    description: >
      State-level retail market metrics derived from County Business Patterns.
      The grain is one row per state and reporting year.

    columns:
      - name: state_fips
        description: U.S. Census state FIPS code.
        data_tests:
          - not_null

      - name: data_year
        description: Reporting year of the CBP dataset.
        data_tests:
          - not_null

      - name: retail_naics_industries
        description: >
          Number of distinct 6-digit retail NAICS industries reported
          for the state.

      - name: total_establishments
        description: Total number of retail establishments.

      - name: total_employment
        description: >
          Total reported retail employment. NULL values in the underlying
          data represent unavailable or suppressed values and are not
          converted to zero.

      - name: total_first_quarter_payroll_thousands
        description: >
          Total first-quarter retail payroll, reported in thousands of dollars.

      - name: total_annual_payroll_thousands
        description: >
          Total annual retail payroll, reported in thousands of dollars.

      - name: employment_reported_records
        description: Number of retail industry records with reported employment.

      - name: employment_unavailable_records
        description: Number of retail industry records with unavailable employment.

      - name: first_quarter_payroll_reported_records
        description: >
          Number of retail industry records with reported first-quarter payroll.

      - name: first_quarter_payroll_unavailable_records
        description: >
          Number of retail industry records with unavailable first-quarter payroll.

      - name: annual_payroll_reported_records
        description: Number of retail industry records with reported annual payroll.

      - name: annual_payroll_unavailable_records
        description: >
          Number of retail industry records with unavailable annual payroll.


  - name: mart_retail_market_state
    description: >
      State-level retail market analysis combining retail business activity
      from County Business Patterns with total state GDP and retail trade GDP
      from the Bureau of Economic Analysis. The grain is one row per state
      and reporting year.

    columns:
      - name: state_fips
        description: Two-digit U.S. Census state FIPS code.
        data_tests:
          - not_null
          - unique

      - name: state_name
        description: State or District of Columbia name.
        data_tests:
          - not_null

      - name: year
        description: Reporting year. Currently limited to 2023.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023]

      - name: retail_establishments
        description: >
          Number of retail establishments in the state.

      - name: retail_employment
        description: >
          Number of reported retail employees in the state.

      - name: retail_annual_payroll
        description: >
          Annual retail payroll in thousands of dollars from
          County Business Patterns.

      - name: total_gdp_annual
        description: >
          Annual total state GDP in millions of current dollars,
          calculated from four quarterly BEA observations.

      - name: retail_gdp_annual
        description: >
          Annual retail trade GDP in millions of current dollars,
          calculated from four quarterly BEA observations.

      - name: retail_gdp_share
        description: >
          Retail trade GDP divided by total state GDP.

      - name: retail_employment_per_establishment
        description: >
          Average retail employment per retail establishment.

      - name: retail_payroll_per_employee
        description: >
          Annual retail payroll in thousands of dollars per retail employee.

      - name: retail_gdp_per_establishment
        description: >
          Annual retail GDP in millions of dollars per retail establishment.

      - name: retail_gdp_per_retail_employee
        description: >
          Annual retail GDP in millions of dollars per retail employee.