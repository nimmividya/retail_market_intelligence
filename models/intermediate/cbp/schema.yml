version: 2

models:
  - name: int_cbp_retail
    description: >
      Detailed County Business Patterns records for U.S. retail industries,
      at the grain of one state, one 6-digit NAICS industry, and one reporting year.

    columns:
      - name: state_fips
        description: U.S. Census state FIPS code.
        data_tests:
          - not_null

      - name: naics_code
        description: 6-digit NAICS code for the retail industry.
        data_tests:
          - not_null

      - name: data_year
        description: Reporting year of the CBP dataset.
        data_tests:
          - not_null

      - name: establishments
        description: Number of business establishments.

      - name: employment
        description: Number of employees. NULL may represent Census suppression.

      - name: employment_flag
        description: Census status or suppression flag for employment.

      - name: first_quarter_payroll
        description: First-quarter payroll. NULL may represent Census suppression.

      - name: first_quarter_payroll_flag
        description: Census status or suppression flag for first-quarter payroll.

      - name: annual_payroll
        description: Annual payroll. NULL may represent Census suppression.

      - name: annual_payroll_flag
        description: Census status or suppression flag for annual payroll.

  - name: int_retail_business
    description: >
      State-level retail business metrics for 2023 derived from the
      County Business Patterns dataset. The model contains one row
      per state and year and preserves Census employment and payroll
      suppression/status flags.

    columns:
      - name: state_fips
        description: Two-digit U.S. Census state FIPS code.
        data_tests:
          - not_null

      - name: year
        description: Reporting year of the CBP dataset.
        data_tests:
          - not_null

      - name: retail_establishments
        description: Number of retail trade establishments.

      - name: retail_employment
        description: Number of employees in retail trade. NULL may represent Census suppression.

      - name: retail_annual_payroll
        description: Annual payroll for retail trade. NULL may represent Census suppression.

      - name: employment_flag
        description: Census status or suppression flag for employment.

      - name: annual_payroll_flag
        description: Census status or suppression flag for annual payroll.

      - name: business_key
        description: Surrogate key generated from STATE_FIPS and YEAR.
        data_tests:
          - not_null
