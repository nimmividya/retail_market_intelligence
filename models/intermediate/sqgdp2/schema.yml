version: 2

models:
  - name: int_sqgdp2_retail
    description: >
      Annual retail trade GDP by U.S. state derived from the quarterly
      SQGDP2 Retail Trade series. Quarterly GDP values are averaged to
      calculate the annual GDP level. U.S. totals and BEA regional
      aggregates are excluded.

    columns:
      - name: GEO_FIPS
        description: >
          Five-digit FIPS code identifying the U.S. state.
        tests:
          - not_null

      - name: GEO_NAME
        description: >
          Name of the U.S. state.
        tests:
          - not_null

      - name: YEAR
        description: >
          Calendar year derived from the quarterly observation.
        tests:
          - not_null

      - name: RETAIL_GDP_ANNUAL
        description: >
          Annual retail trade GDP in millions of current dollars,
          calculated as the average of the four quarterly
          seasonally adjusted annual-rate GDP observations.
        tests:
          - not_null

      - name: QUARTERS_AVAILABLE
        description: >
          Number of quarterly retail GDP observations available for
          the state and year. The intermediate model retains only
          complete years.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 4 ]

      - name: RETAIL_GDP_BUSINESS_KEY
        description: >
          Business key constructed from the state FIPS code and year.
        tests:
          - not_null
          - unique


